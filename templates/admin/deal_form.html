{% extends "base.html" %}
{% block title %}Deal of the Day — Fareflock{% endblock %}
{% block content %}
<section class="post-form">
    <h1>Deal of the Day</h1>
    <form method="POST">
        <label>Banner Message</label>
        <input type="text" name="message" value="{{ deal.message if deal else '' }}" placeholder="e.g. Nairobi to Dubai from $280 — book by Friday" required>

        <label>Link (where clicking the banner goes)</label>
        <input type="text" name="link_url" value="{{ deal.link_url if deal else '' }}" placeholder="/blog/your-post-slug">

        <label class="checkbox-label">
            <input type="checkbox" name="active" {% if deal and deal.active %}checked{% elif not deal %}checked{% endif %}>
            Show this banner on the homepage
        </label>

        <button type="submit" class="btn-primary">Save</button>
    </form>
</section>
{% endblock %}
