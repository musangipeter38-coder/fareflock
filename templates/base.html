<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ meta_title or 'Fareflock' }}{% endblock %}</title>
    <meta name="description" content="{{ meta_description or 'Real flight and hotel deals, honest guides, and travel tips.' }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1" data-cmp-ab="2">
        (function () {
            var script = document.createElement("script");
            script.async = 1;
            script.setAttribute("data-cmp-ab","2");
            script.src = 'https://tpembars.com/NTcyMDc4.js?t=572078';
            document.head.appendChild(script);
        })();
    </script>
</head>
<body>
    <header class="site-header">
        <a href="{{ url_for('home') }}" class="logo">Fareflock</a>
        <nav>
            <a href="{{ url_for('home') }}">Explore</a>
            <a href="{{ url_for('blog') }}">Blog</a>
            <a href="{{ url_for('about') }}">About</a>
        </nav>
    </header>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-messages">
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Fareflock. Fly smarter, travel further.</p>
        <a href="{{ url_for('login') }}" class="admin-dot" aria-label="Admin"></a>
    </footer>
</body>
</html>
