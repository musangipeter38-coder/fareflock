{% extends 'base.html' %}
{% block content %}
<div class="hero-section">
  <h1 class="hero-title">Precision Flight Search.<br>Direct Partner Booking.</h1>
  <p style="color: #94a3b8; font-size: 1.15rem; margin-bottom: 2.5rem;">Search real-time flight inventory across verified networks without markup fees.</p>

  <form id="flight-search-form" class="search-card">
    <div class="form-group">
      <label>Origin</label>
      <input type="text" id="origin" class="form-control" value="NBO" required>
    </div>
    <div class="form-group">
      <label>Destination</label>
      <input type="text" id="destination" class="form-control" value="DXB" required>
    </div>
    <div class="form-group" style="display: flex; align-items: flex-end;">
      <button type="submit" class="btn-primary" style="width: 100%;">Search Live Fares</button>
    </div>
  </form>

  <div class="trust-badge">
    🔒 Real-time pricing verified via Travelpayouts Network. Zero hidden surcharges.
  </div>
</div>

<div id="flight-results" class="results-container"></div>
{% endblock %}
